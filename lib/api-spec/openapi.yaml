components:
  parameters:
    ReportStartDate:
      name: startDate
      in: query
      required: true
      schema: { type: string, format: date-time }
    ReportEndDate:
      name: endDate
      in: query
      required: true
      schema: { type: string, format: date-time }
    ReportStoreId:
      name: storeId
      in: query
      schema: { type: string }
    ReportRegisterId:
      name: registerId
      in: query
      schema: { type: string }
    ReportCashierId:
      name: cashierId
      in: query
      schema: { type: string }
    ReportPaymentMethod:
      name: paymentMethod
      in: query
      schema: { type: string }
  schemas:
    # ── Shared ─────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Auth ───────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [businessName, email, password, firstName, lastName]
      properties:
        businessName:
          type: string
          minLength: 2
        email:
          type: string
          
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          
        password:
          type: string

    ManagerAccessInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1

    ManagerAccessGrant:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [user, tenant, token]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        tenant:
          $ref: "#/components/schemas/Tenant"
        token:
          type: string

    UserProfile:
      type: object
      required: [id, email, firstName, lastName, role, tenantId]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [owner, administrator, manager, cashier, inventory_staff, accountant, employee, super_admin]
        tenantId:
          type: string
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    # ── Tenant ─────────────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, status, planId, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, suspended, trial, expired]
        planId:
          type: string
        planName:
          type: string
        planTier:
          type: string
        billingType:
          type: string
        userCount:
          type: number
        productCount:
          type: number
        customerCount:
          type: number
        subscriptionStatus:
          type: string
        subscriptionStart:
          type: ["string", "null"]
        requiresBillingAction:
          type: boolean
          description: True when the account may only access billing recovery until its Whop subscription is restored.
        billingMessage:
          type: ["string", "null"]
        createdAt:
          type: string


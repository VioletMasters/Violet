        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: number }
        storagePath: { type: string }
        downloadUrl: { type: ["string", "null"] }
        createdAt: { type: string }

    ReleaseAssetUpdate:
      type: object
      required: [downloadUrl]
      properties:
        downloadUrl: { type: ["string", "null"], maxLength: 2048 }

    PlatformRelease:
      type: object
      required: [id, version, channel, status, createdBy, assets]
      properties:
        id: { type: string }
        version: { type: string }
        channel:
          type: string
          enum: [stable, beta, nightly]
        releaseNotes: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, published, archived]
        publishedAt: { type: ["string", "null"] }
        createdBy: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        assets:
          type: array
          items: { $ref: "#/components/schemas/ReleaseAsset" }

    PlatformReleaseInput:
      type: object
      required: [version]
      properties:
        version: { type: string }
        channel: { type: string, enum: [stable, beta, nightly] }
        releaseNotes: { type: string }

    PlatformReleaseUpdate:
      type: object
      properties:
        channel: { type: string, enum: [stable, beta, nightly] }
        releaseNotes: { type: string }
        status: { type: string, enum: [draft, published, archived] }

    LatestRelease:
      allOf:
        - $ref: "#/components/schemas/PlatformRelease"

    AdminBilling:
      type: object
      required: [provider, providerStatus, companyConfigured, plans]
      properties:
        provider: { type: string }
        providerStatus: { type: string }
        companyConfigured: { type: boolean }
        plans:
          type: array
          items:
            type: object
            required: [local]
            properties:
              local: { $ref: "#/components/schemas/Plan" }
              whop:
                type: ["object", "null"]
                properties:
                  id: { type: ["string", "null"] }
                  title: { type: ["string", "null"] }
                  currency: { type: ["string", "null"] }
                  initialPrice: { type: ["number", "null"] }
                  renewalPrice: { type: ["number", "null"] }
                  billingPeriod: { type: ["number", "null"] }
                  visibility: { type: ["string", "null"] }
                  error: { type: ["string", "null"] }

    AdminSale:
      type: object
      required: [id, receiptNumber, tenantId, totalAmount, paymentMethod, status, createdAt]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        tenantId: { type: string }
        tenantName: { type: ["string", "null"] }
        totalAmount: { type: number }
        currency: { type: string }
        paymentMethod: { type: string }
        status: { type: string }
        cashierName: { type: string }
        createdAt: { type: string }

    AdminSalesPage:
      type: object
      required: [data, total, page, limit, summary]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminSale" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
        summary:
          type: object
          required: [revenue, orders]
          properties:
            revenue: { type: number }
            orders: { type: number }

    PlatformAuditLog:
      type: object
      required: [id, action, entityType, summary, createdAt, actorName]
      properties:
        id: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        summary: { type: string }
        metadata: { type: ["string", "null"] }
        createdAt: { type: string }
        actorName: { type: string }

name: Build Violet Desktop Installers

# Triggers: push a release tag (e.g. v1.2.0) or run a build manually via GitHub UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            platform: macos
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ────────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache keyed to the committed lockfile for reproducible installs
          cache: 'npm'
          cache-dependency-path: artifacts/violet-desktop/package-lock.json

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'artifacts/violet-desktop/src-tauri -> target'

      # ── Frontend ────────────────────────────────────────────────────────────
      # Use npm directly (not the pnpm workspace) so the workspace's
      # platform-specific esbuild/rollup exclusion overrides don't apply on Windows.
      # npm ci installs exactly what is in the committed package-lock.json.
      - name: Install frontend dependencies (reproducible)
        working-directory: artifacts/violet-desktop
        run: npm ci

      - name: Build frontend
        working-directory: artifacts/violet-desktop
        run: npm run build

      # ── Tauri build ─────────────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: artifacts/violet-desktop
        run: npx tauri build --target ${{ matrix.target }}
        env:
          CI: 'true'
          # ── Code signing (add these as GitHub Secrets to enable) ─────────
          # Tauri updater signing key (for auto-update signatures):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # Windows Authenticode signing (PFX certificate):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}       # base64-encoded .pfx
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # ── Prepare release assets ───────────────────────────────────────────────
      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/violet-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release-assets/
          cp artifacts/violet-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi release-assets/ || true

      - name: Install and launch Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-ShortcutTarget($shortcutPath) {
            if (-not (Test-Path $shortcutPath)) {
              throw "Expected shortcut was not created: $shortcutPath"
            }
            $shell = New-Object -ComObject WScript.Shell
            $target = $shell.CreateShortcut($shortcutPath).TargetPath
            if (-not $target -or -not (Test-Path $target)) {
              throw "Shortcut does not resolve to an installed Violet executable: $shortcutPath"
            }
            return Get-Item $target
          }

          function Get-StartMenuVioletApp {
            $startMenus = @(
              [Environment]::GetFolderPath("StartMenu"),
              [Environment]::GetFolderPath("CommonStartMenu")
            ) | Where-Object { $_ -and (Test-Path $_) }
            $shortcut = Get-ChildItem -Path $startMenus -Filter "Violet Enterprise.lnk" -Recurse -File |
              Select-Object -First 1
            if (-not $shortcut) {
              throw "Start Menu shortcut for Violet Enterprise was not created."
            }
            return Get-ShortcutTarget $shortcut.FullName
          }

          function Launch-VioletApp($app, $label) {
            Write-Host "Launching $label from $($app.FullName)"
            $process = Start-Process -FilePath $app.FullName -PassThru
            Start-Sleep -Seconds 12
            $process.Refresh()

            if ($process.HasExited) {
              throw "$label exited immediately with code $($process.ExitCode)."
            }
            Write-Host "$label remained running after startup."
            Stop-Process -Id $process.Id -Force
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          }

          $config = Get-Content "artifacts/violet-desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          if ($config.bundle.windows.webviewInstallMode.type -ne "offlineInstaller") {
            throw "Windows desktop builds must use Tauri's offline WebView2 installer."
          }

          $nsis = Get-ChildItem "release-assets" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $nsis) {
            throw "The NSIS installer was not produced."
          }
          if ($nsis.Length -lt 50MB) {
            throw "The NSIS installer is too small to contain the offline WebView2 runtime."
          }

          $nsisInstall = Start-Process -FilePath $nsis.FullName -ArgumentList "/S" -Wait -PassThru
          if ($nsisInstall.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($nsisInstall.ExitCode)."
          }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Violet Enterprise.lnk"
          $desktopApp = Get-ShortcutTarget $desktopShortcut
          $startMenuApp = Get-StartMenuVioletApp
          Launch-VioletApp $desktopApp "NSIS Desktop shortcut"
          Launch-VioletApp $startMenuApp "NSIS Start Menu shortcut"

          $uninstaller = Get-ChildItem -Path $desktopApp.Directory.FullName -Filter "*uninstall*.exe" -File |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw "NSIS installation did not include an uninstaller."
          }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller failed with exit code $($uninstall.ExitCode)."
          }
          $startMenus = @(
            [Environment]::GetFolderPath("StartMenu"),
            [Environment]::GetFolderPath("CommonStartMenu")
          ) | Where-Object { $_ -and (Test-Path $_) }
          $leftoverStartMenuShortcut = Get-ChildItem -Path $startMenus `
            -Filter "Violet Enterprise.lnk" -Recurse -File | Select-Object -First 1
          if ((Test-Path $desktopShortcut) -or
            (Test-Path $desktopApp.FullName) -or
            $leftoverStartMenuShortcut) {
            throw "NSIS uninstall left Violet shortcuts or executable behind; MSI smoke test is not isolated."
          }

          $msi = Get-ChildItem "release-assets" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) {
            throw "The MSI installer was not produced."
          }
          $msiInstall = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" `
            -Wait -PassThru
          if ($msiInstall.ExitCode -notin @(0, 3010)) {
            throw "MSI installer failed with exit code $($msiInstall.ExitCode)."
          }
          $msiApp = Get-StartMenuVioletApp
          Launch-VioletApp $msiApp "MSI Start Menu shortcut"

      - name: Stage desktop startup diagnostics
        if: failure() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA "Violet Enterprise\startup.log"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          if (Test-Path $logPath) {
            Copy-Item $logPath "release-assets/startup.log"
          } else {
            "No Violet Enterprise startup.log was created during this job." |
              Set-Content "release-assets/startup.log"
          }

      - name: Upload desktop startup diagnostics
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-windows-startup-diagnostics
          path: release-assets/startup.log
          if-no-files-found: error

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-assets
          cp artifacts/violet-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            "artifacts/violet-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Violet Enterprise.app" \
            "release-assets/Violet-Enterprise-${{ matrix.platform }}-${{ matrix.target }}.app.zip"

      # ── Upload build artifacts ───────────────────────────────────────────────
      - name: Upload NSIS installer (workflow artifact)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-windows-nsis
          path: release-assets/*.exe
          if-no-files-found: error

      - name: Upload MSI installer (workflow artifact)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-windows-msi
          path: release-assets/*.msi
          if-no-files-found: error

      - name: Upload macOS installers (workflow artifact)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish release installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Windows Desktop Installer

# Triggers: push a release tag (e.g. v1.2.0) or run manually via GitHub UI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — leave blank for a draft build'
        required: false

permissions:
  contents: write   # Needed to create/update GitHub Releases

jobs:
  build-windows:
    name: Windows (NSIS + MSI)
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node ────────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache keyed to the committed lockfile for reproducible installs
          cache: 'npm'
          cache-dependency-path: artifacts/violet-desktop/package-lock.json

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'artifacts/violet-desktop/src-tauri -> target'

      # ── Frontend ────────────────────────────────────────────────────────────
      # Use npm directly (not the pnpm workspace) so the workspace's
      # platform-specific esbuild/rollup exclusion overrides don't apply on Windows.
      # npm ci installs exactly what is in the committed package-lock.json.
      - name: Install frontend dependencies (reproducible)
        working-directory: artifacts/violet-desktop
        run: npm ci

      - name: Build frontend
        working-directory: artifacts/violet-desktop
        run: npm run build

      # ── Tauri build ─────────────────────────────────────────────────────────
      - name: Build Tauri app (NSIS + MSI)
        working-directory: artifacts/violet-desktop
        run: npx tauri build --target x86_64-pc-windows-msvc
        env:
          CI: 'true'
          # ── Code signing (add these as GitHub Secrets to enable) ─────────
          # Tauri updater signing key (for auto-update signatures):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # Windows Authenticode signing (PFX certificate):
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}       # base64-encoded .pfx
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # ── Upload build artifacts ───────────────────────────────────────────────
      - name: Upload NSIS installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-windows-nsis
          path: artifacts/violet-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: violet-enterprise-windows-msi
          path: artifacts/violet-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      # ── Attach to GitHub Release (tag pushes only) ───────────────────────────
      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/violet-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            artifacts/violet-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "violet-desktop"
version = "0.1.0"
description = "Violet Enterprise Desktop App"
authors = []
edition = "2021"

[lib]
name = "violet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
